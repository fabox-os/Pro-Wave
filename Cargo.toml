[workspace]
resolver = "2"
members = ["crates/prowave-app", "crates/prowave-engine", "crates/prowave-garageband-import", "crates/prowave-ladspa", "crates/prowave-logicx-import", "crates/prowave-musicxml", "crates/prowave-plugin-helper", "crates/prowave-plugin-host", "crates/prowave-project", "xtask"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

# Local diagnostics/fix for CLAP bus negotiation (see vendor/plughost-formats).
[patch.crates-io]
plughost-formats = { path = "vendor/plughost-formats" }
