[package]
name = "prowave-engine"
version = "0.1.0"
edition = "2021"
description = "ProWave Studio real-time engine: lock-free transport, voices and cpal output"
license = "GPL-3.0-or-later"

[features]
default = []
# Optional on Windows: the ASIO SDK is required by cpal's ASIO backend.
asio = ["cpal/asio"]

[dependencies]
symphonia = { version = "0.5", default-features = false, features = ["wav", "aiff", "pcm", "flac", "mp3", "caf", "ogg", "vorbis", "isomp4", "aac", "alac", "adpcm"] }
cpal = "0.18.2"
rtrb = "0.4.0"
tracing = "0.1.44"
assert_no_alloc = "1.1.2"

# Memory-mapped PCM sources (not in the browser build).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"

[dev-dependencies]
tempfile = "3.27.0"

# Linux: let cpal give the audio thread real-time priority (needs an rtprio limit or rtkit;
# falls back to normal priority with a logged warning if the system refuses).
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["realtime"] }

# Windows: our own WASAPI stream (IAudioClient3) for the smallest shared-mode period.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Threading",
]
