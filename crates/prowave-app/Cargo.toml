[package]
name = "prowave-app"
version = "0.2.2"
edition = "2021"
description = "Pro Wave desktop app (egui) - clean-room DAW UI inspired by Logic Pro"
license = "GPL-3.0-or-later"

[[bin]]
name = "prowave"
path = "src/main.rs"

[features]
default = ["x11", "accessibility"]
# X11 support through winit. Turn everything off (`--no-default-features`) for a pure Wayland
# build, as an OpenBSD or Wayland-only Linux desktop wants (see issue #79).
x11 = ["eframe/x11", "winit/x11"]
# Screen-reader support. `accesskit_winit`'s defaults pull winit's X11 backend on Linux, so a
# pure Wayland build leaves this off too.
accessibility = ["eframe/accesskit"]

[dependencies]
assert_no_alloc = "1.1.2"
# The defaults are listed one by one so that `x11` can stay optional: an eframe default build
# always pulls winit's X11 backend.
eframe = { version = "0.37.0", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "links",
    "system_fonts",
    "wayland",
    "web_screen_reader",
    "wgpu",
] }
# eframe re-exports winit's types but not its features. `rwh_06` and the Wayland features are
# what winit's own defaults give on Linux; `x11` is added by this crate's default feature.
winit = { version = "0.30.13", default-features = false, features = [
    "rwh_06",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita",
] }
egui = "0.37"
human-panic = "2.0.8"
prowave-engine = { version = "0.1.0", path = "../prowave-engine" }
prowave-garageband-import = { version = "0.1.0", path = "../prowave-garageband-import" }
prowave-project = { version = "0.1.0", path = "../prowave-project" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"
rtrb = "0.4.0"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
midir = "0.11.1"
# Update check and install (src/updater.rs): HTTPS to GitHub, the checksum, the release zip.
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
sha2 = "0.10"
serde_json = "1.0.154"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rhai = { version = "1", features = ["no_module"] }

# The menus in the macOS system menu bar (see src/native_menu.rs).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "=0.21.0", default-features = false }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3.27.0"
