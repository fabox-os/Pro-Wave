[package]
name = "prowave-project"
version = "0.1.0"
edition = "2021"
description = "Pro Wave project file (.prowave): zip with project.json and media/"
license = "GPL-3.0-or-later"

[dependencies]
base64 = "0.22"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"
