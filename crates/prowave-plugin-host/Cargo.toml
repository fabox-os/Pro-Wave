[package]
name = "prowave-plugin-host"
version = "0.1.0"
edition = "2021"
description = "Pro Wave: CLAP, VST3 and Audio Unit plug-in hosting"
license = "GPL-3.0-or-later"

[dependencies]
libloading = "0.8"
rtrb = "0.4.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"
lilv = "0.3.1"
lv2_raw = "0.3.2"

# The plug-in's own process, for this crate's tests (the app is that program in a release).
[[bin]]
name = "prowave-plugin-host"
path = "src/bin/host.rs"
test = false
